# fly.toml app configuration file generated for slovakia-visa-alert on 2026-08-13T09:07:12+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'slovakia-visa-alert'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = "production"
  PORT = "3001"
  HEADLESS = "true"
  DATABASE_URL = "/app/persist/data/visa-alert.db"
  STORAGE_DIR = "/app/persist/storage"
  DEBUG_DIR = "/app/persist/debug"

[http_service]
  internal_port = 3001
  force_https = true
  # This is a continuous background poller, not a request-driven web app —
  # it must never scale to zero or the monitoring loop stops entirely.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[mounts]
  source = "visa_alert_data"
  destination = "/app/persist"
