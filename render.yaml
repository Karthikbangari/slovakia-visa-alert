services:
  - type: web
    name: slovakia-visa-alert
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: HEADLESS
        value: "true"
      # BLS is off by default on this deployment: Render's free tier has
      # no persistent disk, so BLS's saved login is wiped on every
      # restart, producing repeat "session expired" emails for no real
      # reason. See README's top-of-file callout and §22 for the full
      # story — BLS's actual slot calendar is unreachable by automation
      # either way (CAPTCHA+OTP gate on every booking attempt), so
      # disabling it here costs nothing functionally. Flip to "true" if
      # you move to a host with persistent storage (e.g. Fly.io, §11).
      - key: BLS_ENABLED
        value: "false"
      - key: CHECK_INTERVAL_SECONDS
        value: "30"
      - key: CHECK_JITTER_PERCENT
        value: "10"
      - key: ALERT_COOLDOWN_MINUTES
        value: "10"
      - key: TARGET_REGION
        value: Delhi
      - key: TARGET_CATEGORY
        value: D
      - key: TARGET_VISA_TYPE
        value: Long Term
      - key: TARGET_PURPOSE
        value: Study
      # Secrets and per-deploy values — left blank here on purpose so
      # Render prompts for them in the dashboard instead of storing real
      # values in this repo.
      - key: FRONTEND_URL
        sync: false
      - key: ALERT_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
